# PitWallAI Slack app manifest.
# Create the app from this file at https://api.slack.com/apps → Create New App →
# From a manifest. Socket Mode means no request URL and no public host.
# See docs/slack_setup.md for the full walkthrough.
display_information:
  name: PitWallAI
  description: F1 Fantasy companion for our league — save your team, get picks.
  background_color: "#111319"
features:
  # The Messages tab lets league-mates see the bot's DMs (lock reminders, pings).
  # Read-only: people read DMs there but can't type back — buttons still work.
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: true
  bot_user:
    display_name: PitWallAI
    always_online: true
  slash_commands:
    - command: /pitwall
      description: Save your team, get picks, run the league (some replies post to the channel)
      usage_hint: team … | picks | grade | lock | score | record | channel | ping | forget | help
      should_escape: false
oauth_config:
  scopes:
    bot:
      - commands
      - chat:write
      # Open a DM channel to a user so the bot can message them (ping, alerts).
      - im:write
settings:
  # Socket Mode: one long-running process connects out to Slack, so there is no
  # public URL to host or verify.
  socket_mode_enabled: true
  # Socket Mode carries button clicks over the same socket — no request URL
  # needed. Bolt's app.action(...) handles them.
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  # Leave this OFF. Turning rotation on expires the bot token on a schedule and
  # breaks the long-running Socket Mode process (see docs/slack_setup.md).
  token_rotation_enabled: false
